[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autolearn-mcp"
version = "0.1.0"
description = "Auto-learning browser MCP server: explore web systems with any MCP AI client as the brain, persist episodic/semantic/procedural memory, replay skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "playwright", "browser-automation", "ai-agent", "gui-agent"]
dependencies = [
    "playwright>=1.44",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "mcp>=1.2,<2",
]

[project.scripts]
autolearn-mcp = "autolearn.mcp_server:main"
autolearn-install = "autolearn._bootstrap:main"
autolearn-cli = "autolearn.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autolearn"]
